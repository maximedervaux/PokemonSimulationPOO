# Configuration de la simulation (lue depuis le classpath par utils.Config).

simulation.seed=67
simulation.max.steps=30000
simulation.step.delay.ms=1

# Dimensions de la carte, en cases.
map.width=25
map.height=25

# Probabilité qu'une case hors SafeZone contienne un obstacle.
map.obstacle.density=0.2

# Nombre d'agents mobiles par population.
pokemon.per.type=4

# Nombre de messages
messages.count=48
# Ressource contenant les messages, une phrase par ligne.
messages.resource=messages.txt
